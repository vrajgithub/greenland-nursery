<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sellers | Greenland Hyderabad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { nursery: { 700: '#15803d', 950: '#052e16' }, heritage: '#d4af37' }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 font-sans">

    <nav class="bg-white p-6 border-b flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <a href="index.html" class="font-bold text-2xl flex items-center gap-2"><i data-lucide="sprout" class="text-nursery-700"></i> Greenland</a>
        <a href="index.html" class="text-xs font-bold text-nursery-700 flex items-center gap-2">← Back to Nursery Home</a>
    </nav>

    <header class="py-20 text-center bg-nursery-950 text-white relative overflow-hidden">
        <span class="text-heritage text-xs font-black uppercase tracking-[0.3em]">Bestsellers Est. 1985</span>
        <h1 class="text-4xl md:text-5xl font-serif font-bold mt-4 mb-6">Hyderabad's Most Loved Plants</h1>
        <p class="text-slate-400 text-sm max-w-xl mx-auto">Acclimatized for the Telangana sun and hand-nurtured by our experts since 1985.</p>
    </header>

    <main class="max-w-4xl mx-auto py-16 px-6">
        <div id="top-selling-list" class="space-y-6"></div>
    </main>

    <script src="assets/js/data.js"></script>
    <script>
        function renderTop() {
            const container = document.getElementById('top-selling-list');
            const sorted = [...plantsData].sort((a, b) => b.salesCount - a.salesCount).slice(0, 10);
            sorted.forEach((plant, index) => {
                container.innerHTML += `
                    <div class="flex flex-col md:flex-row items-center gap-8 bg-white p-8 rounded-[2.5rem] border border-stone-200 shadow-sm glass-card hover:shadow-xl transition-all group">
                        <div class="text-5xl font-serif font-black text-stone-100 group-hover:text-heritage/20 transition-colors">#${index + 1}</div>
                        <img src="${plant.image}" class="w-32 h-32 object-cover rounded-[2rem] shadow-lg">
                        <div class="flex-grow text-center md:text-left">
                            <h2 class="text-2xl font-bold text-stone-900">${plant.name}</h2>
                            <p class="text-xs text-stone-400 mt-1 uppercase font-bold tracking-[0.2em]">${plant.salesCount} Happy Households in Hyderabad</p>
                        </div>
                        <div class="text-center md:text-right">
                            <span class="text-[9px] font-bold text-stone-400 uppercase block mb-1">Starting from</span>
                            <div class="text-2xl font-black text-stone-900">${plant.price}</div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }
        window.onload = renderTop;
    </script>
</body>
</html>
