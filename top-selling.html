<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Selling | Greenland</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-100">
    <nav class="bg-white p-6 border-b flex justify-between">
        <a href="index.html" class="text-green-700 font-bold">← Back Home</a>
        <div class="font-bold text-stone-400 uppercase tracking-widest text-xs">Best Sellers 2024</div>
    </nav>

    <div class="max-w-4xl mx-auto py-12 px-6">
        <h1 class="text-4xl font-bold mb-10 text-center font-['Playfair_Display']">Most Popular Plants</h1>
        <div id="top-list" class="space-y-6"></div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function renderTop() {
            const list = document.getElementById('top-list');
            const sorted = [...plantsData].sort((a,b) => b.salesCount - a.salesCount).slice(0, 10);

            sorted.forEach((plant, index) => {
                list.innerHTML += `
                    <div class="bg-white p-6 rounded-3xl flex items-center gap-6 shadow-sm border border-stone-200 glass-card">
                        <div class="text-3xl font-black text-green-700/20">#${index + 1}</div>
                        <img src="${plant.image}" class="w-24 h-24 rounded-2xl object-cover shadow-md">
                        <div class="flex-grow">
                            <h2 class="font-bold text-xl text-stone-800">${plant.name}</h2>
                            <p class="text-green-600 text-xs font-bold uppercase tracking-widest">${plant.salesCount} Units Sold</p>
                        </div>
                        <div class="font-bold text-xl text-stone-900">${plant.price}</div>
                    </div>
                `;
            });
            lucide.createIcons();
        }
        window.onload = renderTop;
    </script>
</body>
</html>
